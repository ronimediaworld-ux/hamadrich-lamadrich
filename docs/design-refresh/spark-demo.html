<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><title>ניצוץ מונפש</title>
<style>
html,body{margin:0;height:100%}
body{display:flex;align-items:center;justify-content:center;background:#E6F2F8;font-family:system-ui,sans-serif}
svg.spark{height:440px;width:auto}
.spark { overflow: visible; }
.spark-anim .spark-eyes { transform-box: fill-box; transform-origin: 50% 55%; animation: sparkBlink 5.2s ease-in-out infinite; }
.spark-anim .spark-root { transform-box: fill-box; transform-origin: 50% 100%; animation: sparkBreathe 3.4s ease-in-out infinite; }
.spark-anim .spark-outer { transform-box: fill-box; transform-origin: 50% 100%; animation: sparkFlick 2.3s ease-in-out infinite; }
.spark-anim .spark-mid { transform-box: fill-box; transform-origin: 50% 100%; animation: sparkFlick 1.9s ease-in-out -.6s infinite; }
.spark-anim .spark-arm-r { transform-origin: 1024px 690px; animation: sparkWave 1.5s ease-in-out infinite; }
.spark-anim .spark-arm-l { transform-origin: 522px 760px; animation: sparkSway 3s ease-in-out infinite; }
.spark-anim .spark-leg-l { transform-origin: 692px 846px; animation: sparkStep 1.7s ease-in-out infinite; }
.spark-anim .spark-leg-r { transform-origin: 786px 848px; animation: sparkStep 1.7s ease-in-out -.85s infinite; }
.spark-anim .spark-s { transform-box: fill-box; transform-origin: 50% 50%; animation: sparkPulse 2.2s ease-in-out infinite; }
.spark-anim .spark-s2 { animation-delay: -.5s; }
.spark-anim .spark-s3 { animation-delay: -1.1s; }
.spark-anim .spark-s4 { animation-delay: -1.6s; }
@keyframes sparkBreathe { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-1.6%) scale(.992, 1.014); } }
@keyframes sparkFlick { 0%, 100% { transform: scale(1, 1) skewX(0deg); } 35% { transform: scale(1.012, 1.03) skewX(-1.4deg); } 70% { transform: scale(.992, 1.012) skewX(1deg); } }
@keyframes sparkBlink { 0%, 91%, 100% { transform: scaleY(1); } 94.5% { transform: scaleY(.08); } }
@keyframes sparkWave { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(16deg); } }
@keyframes sparkSway { 0%, 100% { transform: rotate(2deg); } 50% { transform: rotate(-5deg); } }
@keyframes sparkStep { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
@keyframes sparkPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.8); } }
</style></head><body>
